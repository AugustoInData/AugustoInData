<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfólio Profissional - Carlos Augusto</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Segoe+UI&display=swap" rel="stylesheet" />
<style>
body {
  background-color: #f5f7fa; /* cinza muito claro */
  color: #333333;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  scroll-behavior: smooth;
}
  #root {
    max-width: 900px;
    width: 100%;
  }

  .fade-in {
    opacity: 0;
    transform: translateY(15px);
    animation-fill-mode: forwards;
    animation-name: fadeInUp;
    animation-duration: 0.8s;
    animation-timing-function: ease-out;
  }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  header {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-bottom: 50px;
    border-bottom: 2px solid #c4d1f5;
    padding-bottom: 20px;
  }

  header img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid #2A3F66;
    object-fit: cover;
    flex-shrink: 0;
    box-shadow: 0 0 12px #2A3F66AA;
    transition: transform 0.3s ease;
  }
  header img:hover {
    transform: scale(1.08);
    box-shadow: 0 0 18px #2A3F66dd;
  }

  header div {
    flex: 1;
  }

  header h1 {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 2.4rem;
    margin-bottom: 8px;
    color: #2A3F66;
    font-weight: 600;
    letter-spacing: 1.3px;
  }

  header p {
    font-size: 1.15rem;
    color: #506285;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  main section {
    margin-bottom: 55px;
  }

  main section h2 {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-size: 1.9rem;
    margin-bottom: 30px;
    color: #2A3F66;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 12px;
    border-left: 8px solid #2A3F66;
    padding-left: 15px;
  }
  main section h2 svg {
    width: 28px;
    height: 28px;
    fill: #2A3F66;
    flex-shrink: 0;
  }

  .card-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px;
  }

  .card {
    background-color: #f8f9fa;
    border-radius: 16px;
    padding: 25px 30px;
    box-shadow:
      0 2px 6px rgba(0, 0, 0, 0.09),
      0 6px 12px rgba(0, 0, 0, 0.12);
    transition:
      transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
      box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: default;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card:hover {
    transform: translateY(-10px);
    box-shadow:
      0 10px 20px rgba(0, 0, 0, 0.12),
      0 20px 40px rgba(0, 0, 0, 0.15);
  }

  .card h3 {
    color: #2c3e50;
    margin-bottom: 18px;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .card p {
    flex-grow: 1;
    font-size: 1rem;
    color: #5d6d7e;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .card a {
    background: linear-gradient(135deg, #243a66, #2A3F66);
    color: #ffffff;
    text-decoration: none;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 12px;
    align-self: flex-start;
    transition: background 0.4s ease, box-shadow 0.4s ease;
    box-shadow: 0 6px 12px #1f3150cc;
  }

  .card a:hover {
    background: linear-gradient(135deg, #1f3150, #223b5b);
    box-shadow: 0 10px 20px #17273bcc;
  }

  a {
    color: #2A3F66;
    text-decoration: none;
    transition: color 0.3s ease;
  }
  a:hover {
    color: #1f3150;
    text-decoration: underline;
  }

  #contato p {
    font-size: 1rem;
    margin-bottom: 14px;
    font-weight: 500;
  }

  footer {
    border-top: 2px solid #c4d1f5;
    padding: 20px 0 10px 0;
    text-align: center;
    font-size: 0.9rem;
    color: #506285;
  }
  footer a {
    color: #2A3F66;
    font-weight: 600;
    margin: 0 10px;
    text-decoration: none;
  }
  footer a:hover {
    color: #1f3150;
    text-decoration: underline;
  }

  @media (max-width: 520px) {
    header {
      flex-direction: column;
      text-align: center;
      gap: 18px;
    }
    header img {
      margin-bottom: 10px;
    }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

<script>
  const e = React.createElement;

  function IconProjects() {
    return e('svg', { xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24" }, 
      e('path', { d: "M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zm0-10v2h14V7H7z" })
    );
  }
  function IconDashboard() {
    return e('svg', { xmlns:"http://www.w3.org/2000/svg", viewBox:"0 0 24 24" },
      e('path', { d:"M4 18h2v-6H4v6zm5 0h2v-10h-2v10zm5 0h2v-14h-2v14zm5 0h2v-4h-2v4z" })
    );
  }
  function IconAbout() {
    return e('svg', { xmlns:"http://www.w3.org/2000/svg", viewBox:"0 0 24 24" },
      e('path', { d:"M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" })
    );
  }
  function IconContact() {
    return e('svg', { xmlns:"http://www.w3.org/2000/svg", viewBox:"0 0 24 24" },
      e('path', { d:"M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" })
    );
  }

  function Header({ photo, name, title }) {
    return e('header', null,
      e('img', { src: photo, alt: `Foto de ${name}`, loading: "lazy" }),
      e('div', null,
        e('h1', null, name),
        e('p', null, title)
      )
    );
  }

  function Card({ title, description, link, linkText }) {
    return e('div', { className: 'card fade-in' },
      e('h3', null, title),
      e('p', null, description),
      e('a', { href: link, target: '_blank', rel: 'noopener noreferrer' }, linkText)
    );
  }

  function Section({ title, Icon, children, id }) {
    return e('section', { id, className: 'fade-in' },
      e('h2', null,
        e(Icon, null),
        title
      ),
      children
    );
  }

  function Footer() {
    return e('footer', null,
      "© 2025 Carlos Augusto | ",
      e('a', { href: 'mailto:adm.augustocarlos@gmail.com' }, 'Email'),
      " | ",
      e('a', { href: 'https://www.linkedin.com/in/augustoindata', target: '_blank', rel: 'noopener noreferrer' }, 'LinkedIn')
    );
  }

  function App() {
    const projetos = [
      {
        title: "Dashboard Vendas 2025",
        description: "Dashboard interativo que monitora vendas por região, com KPIs e tendências mensais.",
        link: "https://linkdoproj1.com",
        linkText: "Ver Projeto"
      },
      {
        title: "Análise de Churn",
        description: "Projeto de análise preditiva para identificar clientes com risco de cancelamento.",
        link: "https://linkdoproj2.com",
        linkText: "Ver Projeto"
      },
      {
        title: "Relatório Financeiro Automatizado",
        description: "Automatização do relatório mensal de resultados financeiros utilizando Python e Excel.",
        link: "https://linkdoproj3.com",
        linkText: "Ver Projeto"
      }
    ];

    const dashboards = [
      {
        title: "Dashboard de Marketing",
        description: "Visualização das campanhas, conversões e ROI com filtros dinâmicos.",
        link: "https://linkdashboard1.com",
        linkText: "Ver Dashboard"
      },
      {
        title: "Dashboard de Performance Operacional",
        description: "Indicadores operacionais para monitoramento em tempo real da produção.",
        link: "https://linkdashboard2.com",
        linkText: "Ver Dashboard"
      }
    ];

    return e(React.Fragment, null,
      e(Header, {
        photo: "https://raw.githubusercontent.com/AugustoInData/AugustoInData/refs/heads/main/portfolio_site/img/sua-foto.jpeg",
        name: "Carlos Augusto",
        title: "Analista de Dados | Visualização | Planejamento Financeiro"
      }),

      e('main', null,
        e(Section, { id: "sobre", title: "Sobre Mim", Icon: IconAbout },
          e('p', null, "Sou analista de dados apaixonado por transformar dados em decisões estratégicas. Tenho experiência em SQL, Power BI, Python e análise financeira, buscando sempre entregar resultados que impactam positivamente os negócios.")
        ),

        e(Section, { id: "projetos", title: "Projetos", Icon: IconProjects },
          e('div', { className: 'card-list' },
            projetos.map((proj, i) =>
              e(Card, {
                key: i,
                title: proj.title,
                description: proj.description,
                link: proj.link,
                linkText: proj.linkText
              })
            )
          )
        ),

        e(Section, { id: "dashboards", title: "Dashboards", Icon: IconDashboard },
          e('div', { className: 'card-list' },
            dashboards.map((dash, i) =>
              e(Card, {
                key: i,
                title: dash.title,
                description: dash.description,
                link: dash.link,
                linkText: dash.linkText
              })
            )
          )
        ),

        e(Section, { id: "contato", title: "Contato", Icon: IconContact },
          e('p', null, 'Email: ', e('a', { href: 'mailto:adm.augustocarlos@gmail.com' }, 'adm.augustocarlos@gmail.com')),
          e('p', null, 'LinkedIn: ', e('a', { href: 'https://www.linkedin.com/in/augustoindata', target: '_blank', rel: 'noopener noreferrer' }, 'linkedin.com/in/augustoindata'))
        )
      ),

      e(Footer, null)
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(e(App));
</script>

</body>
</html>
